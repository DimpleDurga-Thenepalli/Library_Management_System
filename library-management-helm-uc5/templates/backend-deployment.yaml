apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-backend
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: library-backend
  template:
    metadata:
      labels:
        app: library-backend
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.service.port }}
          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: library-config
                  key: DB_URL
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: library-config
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.database }}
                  key: DB_PASSWORD
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.admin }}
                  key: ADMIN_USERNAME
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.admin }}
                  key: ADMIN_PASSWORD
          startupProbe:
            tcpSocket:
              port: {{ .Values.backend.service.port }}
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: {{ .Values.backend.service.port }}
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ .Values.backend.service.port }}
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: library-backend
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    app: library-backend
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.port }}
      

