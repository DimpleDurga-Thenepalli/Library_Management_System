apiVersion: v1
kind: ConfigMap
metadata:
  name: library-config
  namespace: library-k8s-lab
data:
  POSTGRES_DB: library_management
  POSTGRES_USER: library_app
  DB_URL: jdbc:postgresql://library-db:5432/library_management
  DB_USERNAME: library_app
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: library-db-data
  namespace: library-k8s-lab
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-db
  namespace: library-k8s-lab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: library-db
  template:
    metadata:
      labels:
        app: library-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: library-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: library-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: library-db-secret
                  key: DB_PASSWORD
          volumeMounts:
            - name: db-storage
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: library-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: library-db
  namespace: library-k8s-lab
spec:
  selector:
    app: library-db
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
