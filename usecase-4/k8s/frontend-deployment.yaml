apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-frontend
  namespace: library-k8s-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: library-frontend
  template:
    metadata:
      labels:
        app: library-frontend
    spec:
      imagePullSecrets:
        - name: harbor-registry-secret
      containers:
        - name: frontend
          image: host.docker.internal:8082/usecase1/library-management-frontend:33
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: library-frontend
  namespace: library-k8s-lab
spec:
  type: ClusterIP
  selector:
    app: library-frontend
  ports:
    - port: 80
      targetPort: 80
