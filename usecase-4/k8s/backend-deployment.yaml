apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-backend
  namespace: library-k8s-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: library-backend
  template:
    metadata:
      labels:
        app: library-backend
    spec:
      imagePullSecrets:
        - name: harbor-registry-secret
      containers:
        - name: backend
          image: host.docker.internal:8082/usecase1/library-management:33
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: library-config
                  key: DB_URL
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: library-config
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: library-db-secret
                  key: DB_PASSWORD
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: library-admin-secret
                  key: ADMIN_USERNAME
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: library-admin-secret
                  key: ADMIN_PASSWORD
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: library-backend
  namespace: library-k8s-lab
spec:
  type: ClusterIP
  selector:
    app: library-backend
  ports:
    - port: 8080
      targetPort: 8080
