apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: library-ingress
  namespace: library-k8s-lab
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: library-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: library-frontend
                port:
                  number: 80
