spring.application.name=Library
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/library_management}
spring.datasource.username=${DB_USERNAME:library_app}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=30m
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.error.include-message=never
library.admin.username=${ADMIN_USERNAME:admin}
library.admin.password=${ADMIN_PASSWORD}
